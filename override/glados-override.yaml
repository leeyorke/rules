# https://mihomo.party/docs/guide/override/yaml

rule-providers:
  Copilot:
    url: https://raw.githubusercontent.com/leeyorke/rules/refs/heads/main/rulesets/copilot.list
    path: ./ruleset/copilot.list
    behavior: classical
    interval: 86400
    format: text
    type: http
  Media:
    url: https://raw.githubusercontent.com/leeyorke/rules/refs/heads/main/rulesets/Inter-media.list
    path: ./ruleset/Inter-media.list
    behavior: classical
    interval: 86400
    format: text
    type: http
  OpenAI:
    url: https://raw.githubusercontent.com/leeyorke/rules/refs/heads/main/rulesets/openai.list
    path: ./ruleset/openai.list
    behavior: classical
    interval: 86400
    format: text
    type: http
  Google:
    url: https://raw.githubusercontent.com/leeyorke/rules/refs/heads/main/rulesets/google.list
    path: ./ruleset/google.list
    behavior: classical
    interval: 86400
    format: text
    type: http

+rules:
  - "RULE-SET,Copilot,Research + AI"
  - "RULE-SET,OpenAI,Research + AI"
  - "RULE-SET,Google,Default Proxy"
  - "RULE-SET,Media,Streaming"
  - "DOMAIN-SUFFIX,zenmux.ai,Research + AI"
