# Vless-Reality 转 clash yaml 模板
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

proxies:
  - name: Rks-VPS-Reality
    # vps ip
    server: x.x.x.x
    # xray 端口号
    port: 8443
    type: vless
    tls: true
    udp: true
    # uuid
    uuid: "*************************"
    servername: gateway.icloud.com
    network: tcp
    flow: xtls-rprx-vision
    client-fingerprint: chrome
    reality-opts:
      # 公钥
      public-key: "**************************"
      # 短id
      short-id: "************************"
      support-x25519mlkem768: true

proxy-groups:
  - name: Default Proxy
    type: select
    proxies:
      - ♻️ 自动选择
      - Rks-VPS-Reality
  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - Rks-VPS-Reality
  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - Default Proxy
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - Default Proxy
      - DIRECT

rules:
  - MATCH,🐟 漏网之鱼
